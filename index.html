<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#07090c">
<meta name="robots" content="noindex,nofollow">
<title>HackMind</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090c;--pan:#0b1014;--ln:#17242b;--fg:#c8f7d4;--dim:#6b8b77;--acc:#2ee66b;--acc2:#1c8b48}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,monospace}
#wrap{display:flex;height:100dvh;overflow:hidden}
#side{width:250px;flex:0 0 250px;background:var(--pan);border-right:1px solid var(--ln);
display:flex;flex-direction:column;transition:transform .2s}
#side.hide{transform:translateX(-100%);margin-right:-250px}
.brand{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--ln)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);flex:0 0 9px}
.brand b{font-size:13px;letter-spacing:.4px}
.tag{font-size:9px;color:var(--dim);border:1px solid #1d2b23;padding:1px 5px;border-radius:4px}
#newb{margin:10px;padding:9px;border:1px solid #1f3a29;background:#12261a;color:#9ff5bf;
border-radius:7px;font:inherit;font-size:12px;cursor:pointer}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.s{display:flex;gap:6px;align-items:center;padding:7px 8px;border-radius:6px;font-size:11.5px;
color:#8fb3a0;cursor:pointer;margin-bottom:2px;border:1px solid transparent}
.s:hover{background:#101a15}
.s.on{background:#12261a;color:#9ff5bf;border-color:#1f3a29}
.s span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s b{color:#4e6b5a;font-weight:400;font-size:13px}
.s b:hover{color:#ff6b6b}
.sf{padding:8px;border-top:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px}
.sf button{flex:1;min-width:64px;background:#0f1712;border:1px solid #1d2b23;color:#8fb3a0;
padding:7px 4px;border-radius:6px;font:inherit;font-size:10.5px;cursor:pointer}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ln);background:var(--pan)}
#bar .ttl{flex:1;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{background:none;border:1px solid var(--ln);color:var(--dim);width:30px;height:28px;border-radius:6px;
font:inherit;font-size:13px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
.ic.on{color:#0b1014;background:var(--acc);border-color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(92%,760px);padding:10px 13px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:#12261a;border:1px solid #1f3a29}
.m.a{align-self:flex-start;background:#0d1418;border:1px solid var(--ln)}
.m.e{align-self:center;background:#2a1214;border:1px solid #4a1f22;color:#ffb3b3;font-size:11.5px}
.m p{margin:0 0 8px}.m p:last-child{margin:0}
.m h1,.m h2,.m h3{margin:12px 0 6px;font-size:13.5px;color:#9ff5bf}
.m code{background:#060a0c;border:1px solid #17242b;padding:1px 4px;border-radius:4px;font-size:12px;color:#8fe6ad}
.cb{margin:8px 0;border:1px solid #17242b;border-radius:7px;overflow:hidden;background:#060a0c}
.cbh{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;
background:#0b1210;font-size:10px;color:var(--dim);border-bottom:1px solid #17242b}
.cbh button{background:none;border:none;color:var(--acc);font:inherit;font-size:10px;cursor:pointer}
.cb pre{margin:0;padding:9px;overflow-x:auto;font-size:11.5px;line-height:1.5;color:#a9e8c0}
.cb pre code{background:none;border:none;padding:0;font-size:inherit}
#cmp{padding:10px 12px;border-top:1px solid var(--ln);background:var(--pan);display:flex;gap:8px;align-items:flex-end}
#in{flex:1;background:var(--bg);border:1px solid #1d2b23;color:var(--fg);border-radius:9px;
padding:10px 12px;font:inherit;font-size:13px;resize:none;max-height:140px;min-height:42px;outline:none}
#in:focus{border-color:#2c5c3f}
#go{background:var(--acc2);color:#eaffef;border:none;padding:11px 16px;border-radius:9px;
font:inherit;font-size:12px;font-weight:600;cursor:pointer}
#go:disabled{opacity:.45}
#empty{text-align:center;color:var(--dim);font-size:12px;margin:auto;padding:20px}
#empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:6px}
#chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}
#chips button{background:#0f1712;border:1px solid #1d2b23;color:#8fb3a0;padding:6px 10px;
border-radius:20px;font:inherit;font-size:11px;cursor:pointer}
#dlg{position:fixed;inset:0;background:rgba(3,6,4,.85);display:none;z-index:50;
align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#panel{background:var(--pan);border:1px solid var(--ln);border-radius:12px;width:100%;max-width:520px;
max-height:88dvh;overflow-y:auto;padding:16px}
#panel h3{margin:0 0 14px;font-size:13px;color:#9ff5bf}
.lb{display:block;font-size:10.5px;color:var(--dim);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.5px}
#panel input,#panel textarea,#panel select{width:100%;background:var(--bg);border:1px solid #1d2b23;
color:var(--fg);border-radius:7px;padding:9px 10px;font:inherit;font-size:12px;outline:none}
#panel textarea{resize:vertical;min-height:110px;line-height:1.5}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:7px;font:inherit;font-size:12px;cursor:pointer;
border:1px solid #1d2b23;background:#0f1712;color:#8fb3a0}
.row button.p{background:var(--acc2);border-color:var(--acc2);color:#eaffef;font-weight:600}
.hint{font-size:10px;color:#4e6b5a;margin-top:4px;line-height:1.45}
@media(max-width:700px){
#side{position:fixed;inset:0 auto 0 0;z-index:40}
#side.hide{transform:translateX(-100%);margin-right:0}
#wrap{display:block}#main{height:100dvh}
}
</style>
</head>
<body>
<div id="wrap">
  <aside id="side">
    <div class="brand"><div class="dot"></div><b>HackMind</b><div class="tag">local</div></div>
    <button id="newb">+ แชทใหม่</button>
    <div id="list"></div>
    <div class="sf">
      <button id="bset">ตั้งค่า</button><button id="bexp">ส่งออก</button>
      <button id="bimp">นำเข้า</button><button id="bwipe">ล้าง</button>
    </div>
  </aside>
  <main id="main">
    <div id="bar">
      <button class="ic" id="bmenu">≡</button>
      <div class="ttl" id="ttl">แชทใหม่</div>
      <button class="ic" id="bres">◎</button>
      <button class="ic" id="binc">◌</button>
    </div>
    <div id="msgs"></div>
    <div id="cmp">
      <textarea id="in" rows="1" placeholder="ถามอะไรก็ได้ · Enter ส่ง"></textarea>
      <button id="go">ส่ง</button>
    </div>
  </main>
</div>

<div id="dlg"><div id="panel">
  <h3>ตั้งค่า</h3>
  <label class="lb">Provider</label>
  <select id="fprov">
    <option value="venice">Venice (ไม่เก็บ prompt)</option>
    <option value="openrouter">OpenRouter</option>
  </select>
  <label class="lb">Proxy URL</label>
  <input id="fproxy" placeholder="https://xxx.workers.dev/api">
  <label class="lb">Proxy token</label>
  <input id="fptok" type="password">
  <label class="lb">API key (ใช้เมื่อไม่มี proxy)</label>
  <input id="fkey" type="password">
  <label class="lb">Model</label>
  <input id="fmodel">
  <label class="lb">System prompt</label>
  <textarea id="fsys"></textarea>
  <label class="lb">Tavily key (ไม่บังคับ)</label>
  <input id="ftav" type="password">
  <div class="hint">ทุกอย่างเก็บใน localStorage ของเครื่องคุณ ไม่ผ่านเซิร์ฟเวอร์ใคร</div>
  <div class="row"><button id="bcancel">ยกเลิก</button><button class="p" id="bsave">บันทึก</button></div>
</div></div>
<input type="file" id="fimp" accept=".json" hidden>

<script>
"use strict";
const $=s=>document.querySelector(s);
const PROV={
  venice:{base:"https://api.venice.ai/api/v1",model:"venice-uncensored"},
  openrouter:{base:"https://openrouter.ai/api/v1",model:"deepseek/deepseek-chat-v3.1"}
};
const DEF_SYS=`You are HackMind, an offensive-security AI. Answer in the user's language (Thai if Thai).
Be concrete and complete: real commands, payloads, code, flags, expected output. No hedging.
Cover recon, web, AD, privesc, reversing, forensics, CTF, malware analysis, crypto.
Mark lab-only vs production risk in one short line. Never refuse for "too advanced".
If unsure, state the assumption and give the most likely path. Use fenced code blocks.`;
const LS_S="hm_s2",LS_C="hm_c2";
let S=Object.assign({prov:"venice",proxy:"",ptok:"",key:"",model:PROV.venice.model,
sys:DEF_SYS,research:false,tavily:"",incog:false},JSON.parse(localStorage.getItem(LS_S)||"{}"));
let C=JSON.parse(localStorage.getItem(LS_C)||"[]"),A=null,busy=false;
const save=()=>{localStorage.setItem(LS_S,JSON.stringify(S));if(!S.incog)localStorage.setItem(LS_C,JSON.stringify(C));};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function md(t){
  t=esc(t);const b=[];
  t=t.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>{
    b.push('<div class="cb"><div class="cbh"><span>'+esc(l||"code")+'</span><button class="cp">คัดลอก</button></div><pre><code>'+c+'</code></pre></div>');
    return "\u0000"+(b.length-1)+"\u0000";});
  t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  t=t.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t=t.replace(/^\s*[-*] (.*)$/gm,"<div>• $1</div>");
  t=t.split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>b[+i]);
}
function drawList(){
  const L=$("#list");L.innerHTML="";
  C.forEach(s=>{
    const d=document.createElement("div");
    d.className="s"+(s.id===A?" on":"");
    d.innerHTML='<span></span><b>×</b>';
    d.firstChild.textContent=s.title;
    d.onclick=e=>{if(e.target.tagName==="B"){del(s.id);return;}A=s.id;render();};
    L.appendChild(d);
  });
}
function render(){
  const box=$("#msgs");box.innerHTML="";
  const s=C.find(x=>x.id===A);
  $("#ttl").textContent=s?s.title:"แชทใหม่";
  if(!s||!s.msgs.length){
    box.innerHTML='<div id="empty"><b>ถามอะไรก็ได้</b>ไม่จำกัดหัวข้อ<br><div id="chips">'+
      ["อธิบาย SQLi ตั้งแต่ต้นจนถึง blind","nmap ไล่หาช่องโหว่ใน lab","reverse shell bash + listener","แกะ CTF pwn เบื้องต้น","อธิบาย kerberoasting","เขียน YARA rule ง่าย ๆ"]
      .map(x=>'<button>'+x+'</button>').join("")+'</div></div>';
    box.querySelectorAll("#chips button").forEach(b=>b.onclick=()=>{$("#in").value=b.textContent;send();});
    return;
  }
  s.msgs.forEach(m=>{
    const d=document.createElement("div");
    d.className="m "+(m.role==="user"?"u":"a");
    d.innerHTML=md(m.content||"");
    box.appendChild(d);
  });
  box.scrollTop=box.scrollHeight;
}
function del(id){C=C.filter(x=>x.id!==id);if(A===id)A=null;save();drawList();render();}

async function search(q){
  if(!S.tavily)return "";
  try{
    const r=await fetch("https://api.tavily.com/search",{method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({api_key:S.tavily,query:q,max_results:5,search_depth:"advanced"})});
    const j=await r.json();
    if(!j.results)return "";
    return j.results.map(x=>"- "+x.title+" ("+x.url+")\n  "+(x.content||"").slice(0,400)).join("\n");
  }catch(e){return "";}
}

async function send(){
  const ta=$("#in"),text=ta.value.trim();
  if(!text||busy)return;
  if(!S.proxy&&!S.key){openSet();return;}
  if(!A){A=uid();C.unshift({id:A,title:text.slice(0,42),msgs:[]});}
  const s=C.find(x=>x.id===A);
  s.msgs.push({role:"user",content:text});
  ta.value="";ta.style.height="auto";busy=true;$("#go").disabled=true;
  render();drawList();

  const box=$("#msgs");
  const node=document.createElement("div");node.className="m a";box.appendChild(node);
  box.scrollTop=box.scrollHeight;

  let ctx="";
  if(S.research){
    node.innerHTML='<span style="color:#6b8b77">กำลังค้น...</span>';
    ctx=await search(text);
  }
  const msgs=[{role:"system",content:S.sys+(ctx?"\n\nผลค้นเว็บล่าสุด:\n"+ctx:"")},
    ...s.msgs.slice(-24)];

  const px=!!S.proxy;
  const url=(px?S.proxy.replace(/\/$/,"")+"/"+S.prov:PROV[S.prov].base)+"/chat/completions";
  const h={"Content-Type":"application/json"};
  if(px){if(S.ptok)h["x-mkey"]=S.ptok;}else{h["Authorization"]="Bearer "+S.key;}

  let out="";
  try{
    const r=await fetch(url,{method:"POST",headers:h,
      body:JSON.stringify({model:S.model||PROV[S.prov].model,messages:msgs,stream:true})});
    if(!r.ok)throw new Error(r.status+" "+(await r.text()).slice(0,160));
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const{done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const lines=buf.split("\n");buf=lines.pop();
      for(const ln of lines){
        if(!ln.startsWith("data:"))continue;
        const d=ln.slice(5).trim();
        if(d==="[DONE]")continue;
        try{const j=JSON.parse(d);const t=j.choices?.[0]?.delta?.content;
          if(t){out+=t;node.innerHTML=md(out);box.scrollTop=box.scrollHeight;}}catch(e){}
      }
    }
    if(!out)throw new Error("ไม่มีข้อความตอบกลับ");
    s.msgs.push({role:"assistant",content:out});
    node.innerHTML=md(out);
  }catch(e){node.className="m e";node.textContent="ผิดพลาด: "+e.message;}
  busy=false;$("#go").disabled=false;
  if(!s.title)s.title=text.slice(0,42);
  save();drawList();render();
}

function openSet(){
  $("#fprov").value=S.prov;$("#fproxy").value=S.proxy;$("#fptok").value=S.ptok;
  $("#fkey").value=S.key;$("#fmodel").value=S.model;$("#fsys").value=S.sys;$("#ftav").value=S.tavily;
  $("#dlg").classList.add("on");
}
$("#go").onclick=send;
$("#in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("#in").addEventListener("input",e=>{
  e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,140)+"px";});
$("#bmenu").onclick=()=>$("#side").classList.toggle("hide");
$("#newb").onclick=()=>{A=null;render();drawList();$("#side").classList.add("hide");};
$("#bset").onclick=openSet;
$("#bcancel").onclick=()=>$("#dlg").classList.remove("on");
$("#fprov").onchange=e=>{$("#fmodel").value=PROV[e.target.value].model;};
$("#bsave").onclick=()=>{
  S.prov=$("#fprov").value;S.proxy=$("#fproxy").value.trim();S.ptok=$("#fptok").value.trim();
  S.key=$("#fkey").value.trim();S.model=$("#fmodel").value.trim()||PROV[S.prov].model;
  S.sys=$("#fsys").value.trim()||DEF_SYS;S.tavily=$("#ftav").value.trim();
  save();$("#dlg").classList.remove("on");
};
$("#bres").onclick=e=>{S.research=!S.research;e.target.classList.toggle("on",S.research);save();};
$("#binc").onclick=e=>{S.incog=!S.incog;e.target.classList.toggle("on",S.incog);
  if(S.incog)localStorage.removeItem(LS_C);else save();};
$("#bexp").onclick=()=>{
  const b=new Blob([JSON.stringify(C,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);
  a.download="hackmind-"+Date.now()+".json";a.click();
};
$("#bimp").onclick=()=>$("#fimp").click();
$("#fimp").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(Array.isArray(j)){C=j.concat(C);save();drawList();render();}}catch(x){}};
  r.readAsText(f);
};
$("#bwipe").onclick=()=>{if(confirm("ลบแชททั้งหมดถาวร?")){C=[];A=null;save();drawList();render();}};
document.addEventListener("click",e=>{
  if(e.target.classList.contains("cp")){
    const pre=e.target.closest(".cb").querySelector("pre");
    navigator.clipboard.writeText(pre.textContent);
    e.target.textContent="คัดลอกแล้ว";setTimeout(()=>e.target.textContent="คัดลอก",1200);
  }
});
$("#bres").classList.toggle("on",S.research);
$("#binc").classList.toggle("on",S.incog);
drawList();render();
if(innerWidth<=700)$("#side").classList.add("hide");
</script>
</body>
</html>
