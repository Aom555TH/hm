<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>HackMind v3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#07090c;--pan:#0b1014;--ln:#17242b;--fg:#c8f7d4;--dim:#6b8b77;--acc:#2ee66b;--acc2:#1c8b48}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.55 ui-monospace,Menlo,monospace}
#wrap{display:flex;height:100dvh;overflow:hidden}
#side{width:250px;flex:0 0 250px;background:var(--pan);border-right:1px solid var(--ln);display:flex;flex-direction:column;transition:transform .2s}
#side.hide{transform:translateX(-100%);margin-right:-250px}
.brand{display:flex;align-items:center;gap:8px;padding:12px;border-bottom:1px solid var(--ln)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:0 0 9px}
.brand b{font-size:13px}.tag{font-size:9px;color:var(--dim);border:1px solid #1d2b23;padding:1px 5px;border-radius:4px}
#newb{margin:10px;padding:9px;border:1px solid #1f3a29;background:#12261a;color:#9ff5bf;border-radius:7px;font:inherit;font-size:12px}
#list{flex:1;overflow-y:auto;padding:0 8px 8px}
.s{display:flex;gap:6px;align-items:center;padding:7px 8px;border-radius:6px;font-size:11.5px;color:#8fb3a0;margin-bottom:2px}
.s.on{background:#12261a;color:#9ff5bf}
.s span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sf{padding:8px;border-top:1px solid var(--ln);display:flex;flex-wrap:wrap;gap:6px}
.sf button{flex:1;min-width:60px;background:#0f1712;border:1px solid #1d2b23;color:#8fb3a0;padding:7px 4px;border-radius:6px;font:inherit;font-size:10.5px}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--ln);background:var(--pan)}
#bar .ttl{flex:1;font-size:11.5px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#st{font-size:9.5px;color:#4e6b5a;padding:3px 12px;background:#080d10;border-bottom:1px solid var(--ln);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.ic{background:none;border:1px solid var(--ln);color:var(--dim);width:30px;height:28px;border-radius:6px;font:inherit;font-size:13px}
.ic.on{color:#0b1014;background:var(--acc);border-color:var(--acc)}
#msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(92%,760px);padding:10px 13px;border-radius:10px;font-size:13px;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:#12261a;border:1px solid #1f3a29}
.m.a{align-self:flex-start;background:#0d1418;border:1px solid var(--ln)}
.m.e{align-self:stretch;background:#2a1214;border:1px solid #4a1f22;color:#ffb3b3;font-size:11.5px;white-space:pre-wrap}
.m code{background:#060a0c;border:1px solid #17242b;padding:1px 4px;border-radius:4px;font-size:12px;color:#8fe6ad}
.cb{margin:8px 0;border:1px solid #17242b;border-radius:7px;overflow:hidden;background:#060a0c}
.cbh{display:flex;justify-content:space-between;padding:4px 8px;background:#0b1210;font-size:10px;color:var(--dim)}
.cbh button{background:none;border:none;color:var(--acc);font:inherit;font-size:10px}
.cb pre{margin:0;padding:9px;overflow-x:auto;font-size:11.5px;color:#a9e8c0}
.cb pre code{background:none;border:none;padding:0}
#cmp{padding:10px 12px;border-top:1px solid var(--ln);background:var(--pan);display:flex;gap:8px;align-items:flex-end}
#in{flex:1;background:var(--bg);border:1px solid #1d2b23;color:var(--fg);border-radius:9px;padding:10px 12px;font:inherit;font-size:13px;resize:none;max-height:140px;min-height:42px;outline:none}
#go{background:var(--acc2);color:#eaffef;border:none;padding:11px 16px;border-radius:9px;font:inherit;font-size:12px;font-weight:600}
#dlg{position:fixed;inset:0;background:rgba(3,6,4,.85);display:none;z-index:50;align-items:center;justify-content:center;padding:16px}
#dlg.on{display:flex}
#panel{background:var(--pan);border:1px solid var(--ln);border-radius:12px;width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;padding:16px}
#panel h3{margin:0 0 12px;font-size:13px;color:#9ff5bf}
.lb{display:block;font-size:10.5px;color:var(--dim);margin:12px 0 4px}
#panel input,#panel textarea,#panel select{width:100%;background:var(--bg);border:1px solid #1d2b23;color:var(--fg);border-radius:7px;padding:9px 10px;font:inherit;font-size:12px;outline:none}
#panel textarea{min-height:100px}
#tout{font-size:10px;color:#8fb3a0;background:#060a0c;border:1px solid #17242b;border-radius:7px;padding:8px;margin-top:12px;white-space:pre-wrap;word-break:break-all;display:none}
.row{display:flex;gap:8px;margin-top:16px}
.row button{flex:1;padding:10px;border-radius:7px;font:inherit;font-size:12px;border:1px solid #1d2b23;background:#0f1712;color:#8fb3a0}
.row button.p{background:var(--acc2);border-color:var(--acc2);color:#eaffef;font-weight:600}
.hint{font-size:10px;color:#4e6b5a;margin-top:4px}
@media(max-width:700px){#side{position:fixed;inset:0 auto 0 0;z-index:40}#side.hide{transform:translateX(-100%);margin-right:0}#wrap{display:block}#main{height:100dvh}}
</style>
</head>
<body>
<div id="wrap">
  <aside id="side">
    <div class="brand"><div class="dot"></div><b>HackMind</b><div class="tag">v3</div></div>
    <button id="newb">+ แชทใหม่</button>
    <div id="list"></div>
    <div class="sf"><button id="bset">ตั้งค่า</button><button id="bexp">ส่งออก</button><button id="bimp">นำเข้า</button><button id="bwipe">ล้าง</button></div>
  </aside>
  <main id="main">
    <div id="bar"><button class="ic" id="bmenu">≡</button><div class="ttl" id="ttl">แชทใหม่</div><button class="ic" id="bres">◎</button><button class="ic" id="binc">◌</button></div>
    <div id="st"></div>
    <div id="msgs"></div>
    <div id="cmp"><textarea id="in" rows="1" placeholder="ถามอะไรก็ได้ · Enter ส่ง"></textarea><button id="go">ส่ง</button></div>
  </main>
</div>
<div id="dlg"><div id="panel">
  <h3>ตั้งค่า</h3>
  <label class="lb">Provider</label>
  <select id="fprov"><option value="venice">Venice</option><option value="openrouter">OpenRouter</option></select>
  <label class="lb">Proxy URL (ต้องลงท้าย /api)</label>
  <input id="fproxy" placeholder="https://xxx.workers.dev/api">
  <label class="lb">Proxy token</label>
  <input id="fptok">
  <label class="lb">API key (ใช้เมื่อไม่มี proxy)</label>
  <input id="fkey">
  <label class="lb">Model</label>
  <input id="fmodel">
  <label class="lb">System prompt</label>
  <textarea id="fsys"></textarea>
  <label class="lb">Tavily key (ไม่บังคับ)</label>
  <input id="ftav">
  <pre id="tout"></pre>
  <div class="row"><button id="btest">ทดสอบ</button><button id="bcancel">ยกเลิก</button><button class="p" id="bsave">บันทึก</button></div>
</div></div>
<input type="file" id="fimp" accept=".json" hidden>
<script>
"use strict";
const $=s=>document.querySelector(s);
const PROV={venice:{base:"https://api.venice.ai/api/v1",model:"venice-uncensored"},openrouter:{base:"https://openrouter.ai/api/v1",model:"deepseek/deepseek-chat-v3.1"}};
const DEF_SYS=`You are HackMind, an offensive-security AI. Answer in the user's language. Be concrete: real commands, flags, payloads, expected output. Use fenced code blocks. Never refuse for "too advanced".`;
const LS_S="hm_s3",LS_C="hm_c3";
let S=Object.assign({prov:"venice",proxy:"",ptok:"",key:"",model:"venice-uncensored",sys:DEF_SYS,research:false,tavily:"",incog:false},JSON.parse(localStorage.getItem(LS_S)||"{}"));
let C=JSON.parse(localStorage.getItem(LS_C)||"[]"),A=null,busy=false;
const save=()=>{localStorage.setItem(LS_S,JSON.stringify(S));if(!S.incog)localStorage.setItem(LS_C,JSON.stringify(C));stat();};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function stat(){$("#st").textContent="prov="+S.prov+" proxy="+(S.proxy?"set":"-")+" token="+(S.ptok?"set":"-")+" key="+(S.key?"set":"-")+" model="+S.model;}
function md(t){
  t=esc(t);const b=[];
  t=t.replace(/```(\w*)\n([\s\S]*?)```/g,(m,l,c)=>{b.push('<div class="cb"><div class="cbh"><span>'+esc(l||"code")+'</span><button class="cp">คัดลอก</button></div><pre><code>'+c+'</code></pre></div>');return "\u0000"+(b.length-1)+"\u0000";});
  t=t.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  t=t.replace(/^### (.*)$/gm,"<h3>$1</h3>").replace(/^## (.*)$/gm,"<h2>$1</h2>").replace(/^# (.*)$/gm,"<h1>$1</h1>");
  t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t=t.split(/\n{2,}/).map(p=>"<p>"+p.replace(/\n/g,"<br>")+"</p>").join("");
  return t.replace(/\u0000(\d+)\u0000/g,(m,i)=>b[+i]);
}
function drawList(){const L=$("#list");L.innerHTML="";C.forEach(s=>{const d=document.createElement("div");d.className="s"+(s.id===A?" on":"");d.innerHTML="<span></span><b>×</b>";d.firstChild.textContent=s.title;d.onclick=e=>{if(e.target.tagName==="B"){C=C.filter(x=>x.id!==s.id);if(A===s.id)A=null;save();drawList();render();return;}A=s.id;render();};L.appendChild(d);});}
function render(){
  const box=$("#msgs");box.innerHTML="";
  const s=C.find(x=>x.id===A);
  $("#ttl").textContent=s?s.title:"แชทใหม่";
  if(!s||!s.msgs.length){box.innerHTML='<div style="text-align:center;color:#6b8b77;font-size:12px;margin:auto">ถามอะไรก็ได้</div>';return;}
  s.msgs.forEach(m=>{const d=document.createElement("div");d.className="m "+(m.role==="user"?"u":"a");d.innerHTML=md(m.content||"");box.appendChild(d);});
  box.scrollTop=box.scrollHeight;
}
function buildURL(px){
  const base=px?S.proxy.replace(/\/$/,"")+"/"+S.prov:PROV[S.prov].base;
  return base+"/chat/completions";
}
async function send(){
  const ta=$("#in"),text=ta.value.trim();
  if(!text||busy)return;
  if(!S.proxy&&!S.key){openSet();return;}
  if(!A){A=uid();C.unshift({id:A,title:text.slice(0,42),msgs:[]});}
  const s=C.find(x=>x.id===A);
  s.msgs.push({role:"user",content:text});
  ta.value="";busy=true;$("#go").disabled=true;render();drawList();
  const box=$("#msgs");
  const node=document.createElement("div");node.className="m a";node.textContent="...";box.appendChild(node);box.scrollTop=box.scrollHeight;
  let ctx="";
  if(S.research&&S.tavily){try{const r=await fetch("https://api.tavily.com/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({api_key:S.tavily,query:text,max_results:5})});const j=await r.json();if(j.results)ctx=j.results.map(x=>"- "+x.title+" "+x.url).join("\n");}catch(e){}}
  const msgs=[{role:"system",content:S.sys+(ctx?"\n\nค้นเว็บ:\n"+ctx:"")},...s.msgs.slice(-24)];
  const px=!!S.proxy,url=buildURL(px);
  const h={"Content-Type":"application/json"};
  if(px){if(S.ptok)h["x-mkey"]=S.ptok;}else h["Authorization"]="Bearer "+S.key;
  let out="";
  try{
    const r=await fetch(url,{method:"POST",headers:h,body:JSON.stringify({model:S.model||PROV[S.prov].model,messages:msgs,stream:true})});
    if(!r.ok){const t=await r.text();throw new Error("HTTP "+r.status+"\nURL: "+url+"\n"+t.slice(0,300));}
    const rd=r.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});const lines=buf.split("\n");buf=lines.pop();
      for(const ln of lines){if(!ln.startsWith("data:"))continue;const d=ln.slice(5).trim();if(d==="[DONE]")continue;
        try{const j=JSON.parse(d);const t=j.choices?.[0]?.delta?.content;if(t){out+=t;node.innerHTML=md(out);box.scrollTop=box.scrollHeight;}}catch(e){}}}
    if(!out)throw new Error("ต่อได้แต่ไม่มีข้อความตอบกลับ\nURL: "+url);
    s.msgs.push({role:"assistant",content:out});node.innerHTML=md(out);
  }catch(e){node.className="m e";node.textContent="ผิดพลาด: "+e.message;}
  busy=false;$("#go").disabled=false;save();drawList();render();
}
function openSet(){
  $("#fprov").value=S.prov;$("#fproxy").value=S.proxy;$("#fptok").value=S.ptok;$("#fkey").value=S.key;
  $("#fmodel").value=S.model;$("#fsys").value=S.sys;$("#ftav").value=S.tavily;$("#tout").style.display="none";
  $("#dlg").classList.add("on");
}
$("#btest").onclick=async()=>{
  const out=$("#tout");out.style.display="block";out.textContent="กำลังทดสอบ...";
  const px=!!$("#fproxy").value.trim();
  const url=px?$("#fproxy").value.trim().replace(/\/$/,"")+"/"+$("#fprov").value+"/chat/completions":PROV[$("#fprov").value].base+"/chat/completions";
  const h={"Content-Type":"application/json"};
  if(px){const t=$("#fptok").value.trim();if(t)h["x-mkey"]=t;}else h["Authorization"]="Bearer "+$("#fkey").value.trim();
  out.textContent+="\n"+url;
  try{
    const r=await fetch(url,{method:"POST",headers:h,body:JSON.stringify({model:$("#fmodel").value.trim()||PROV[$("#fprov").value].model,messages:[{role:"user",content:"ping"}],max_tokens:8})});
    out.textContent+="\nHTTP "+r.status+"\n"+(await r.text()).slice(0,400);
  }catch(e){out.textContent+="\nFETCH ERROR: "+e.message;}
};
$("#go").onclick=send;
$("#in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}});
$("#bmenu").onclick=()=>$("#side").classList.toggle("hide");
$("#newb").onclick=()=>{A=null;render();drawList();$("#side").classList.add("hide");};
$("#bset").onclick=openSet;
$("#bcancel").onclick=()=>$("#dlg").classList.remove("on");
$("#fprov").onchange=e=>{$("#fmodel").value=PROV[e.target.value].model;};
$("#bsave").onclick=()=>{
  S.prov=$("#fprov").value;S.proxy=$("#fproxy").value.trim();S.ptok=$("#fptok").value.trim();
  S.key=$("#fkey").value.trim();S.model=$("#fmodel").value.trim()||PROV[S.prov].model;
  S.sys=$("#fsys").value.trim()||DEF_SYS;S.tavily=$("#ftav").value.trim();
  save();$("#dlg").classList.remove("on");
};
$("#bres").onclick=e=>{S.research=!S.research;e.target.classList.toggle("on",S.research);save();};
$("#binc").onclick=e=>{S.incog=!S.incog;e.target.classList.toggle("on",S.incog);if(S.incog)localStorage.removeItem(LS_C);else save();};
$("#bexp").onclick=()=>{const b=new Blob([JSON.stringify(C,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="hm.json";a.click();};
$("#bimp").onclick=()=>$("#fimp").click();
$("#fimp").onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(Array.isArray(j)){C=j.concat(C);save();drawList();render();}}catch(x){}};r.readAsText(f);};
$("#bwipe").onclick=()=>{if(confirm("ลบทั้งหมด?")){C=[];A=null;save();drawList();render();}};
document.addEventListener("click",e=>{if(e.target.classList.contains("cp")){navigator.clipboard.writeText(e.target.closest(".cb").querySelector("pre").textContent);e.target.textContent="คัดลอกแล้ว";setTimeout(()=>e.target.textContent="คัดลอก",1200);}});
$("#bres").classList.toggle("on",S.research);
$("#binc").classList.toggle("on",S.incog);
drawList();render();stat();
if(innerWidth<=700)$("#side").classList.add("hide");
</script>
</body>
</html>
